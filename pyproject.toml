[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "ndevscrap"
version = "0.1.0"
description = "Modular Python data acquisition for retail with reproducible, validated snapshots."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "requests>=2.32,<3",
    "tzdata>=2025.2",
]

[project.scripts]
ndevscrap = "ndevscrap.cli:main"

[dependency-groups]
dev = [
    "pytest>=8,<10",
    "ruff>=0.12,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 88
