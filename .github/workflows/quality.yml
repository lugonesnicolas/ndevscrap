name: Quality

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Validate documentation and SDD
        run: python scripts/validate_repository.py

      - name: Exercise validator failure path
        run: python scripts/validate_repository.py --self-test
